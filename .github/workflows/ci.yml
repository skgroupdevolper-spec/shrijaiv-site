name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CiPassword123
      UPLOAD_DIR: uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck (all errors at once)
        run: |
          node scripts/db.mjs generate >/dev/null 2>&1 || true
          npx tsc --noEmit --pretty false > tsc.log 2>&1 || true
          n=$(grep -c "error TS" tsc.log || true); echo "tsc errors: $n"
          if [ "$n" != "0" ]; then
            grep "error TS" tsc.log | head -120 | split -l 12 - tschunk_
            for f in tschunk_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::warning title=tsc::$msg"; done
          fi
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            msg=$(grep -v '^\s*$' build.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          }
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/auth/me >/dev/null && break; sleep 2; done
      - name: Smoke test
        run: |
          set -e
          trap 'echo "::error title=Smoke test failed::see step output (last command: $BASH_COMMAND)"' ERR
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /about 200
          check /contact 200
          check /faq 200
          check /how-it-works 200
          check /become-a-seller 200
          check /become-a-buyer 200
          check /customer-support 200
          check /terms 200
          check /privacy 200
          check /products 200
          check /sellers 200
          check /requirements 200
          check /pricing 200
          check /category/organic-agriculture 200
          check /category/fruit 200
          check /post-requirement 200
          check /blog 200
          check /blog/organic-certification-india-npop-pgs-guide 200
          check /login 200
          check /register 200
          check /admin/login 200
          check /sitemap.xml 200
          check /robots.txt 200
          check /feed.xml 200
          check /does-not-exist 404
          curl -s http://localhost:3000/sitemap.xml | grep -q '/products' || { echo "::error title=Check failed::Marketplace pages in sitemap"; exit 1; }; echo "Marketplace pages in sitemap"
          curl -s http://localhost:3000/sitemap.xml | grep -q 'hreflang="hi"' || { echo "::error title=Check failed::hreflang in sitemap"; exit 1; }; echo "hreflang in sitemap"
          curl -sf -X POST http://localhost:3000/api/leads -H 'Content-Type: application/json' -d '{"name":"CI Test","phone":"+919876543210","service":"Selling on SHRIJAIV"}'
          echo
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"CiPassword123","admin":true}'
          echo
          curl -sf -b cookies.txt http://localhost:3000/api/admin/leads | grep -q "CI Test"
          curl -sf -b cookies.txt "http://localhost:3000/api/admin/pages?take=200" | grep -q '"slug":"about"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt http://localhost:3000/admin); echo "/admin -> $code"; [ "$code" = "200" ]
          # --- marketplace: seller & buyer accounts and dashboards ---
          curl -sf -c seller.txt -X POST http://localhost:3000/api/auth/register -H 'Content-Type: application/json' -d '{"role":"seller","name":"Ravi Seller","company":"Green Farms","email":"seller@example.com","phone":"9876543210","password":"SellerPass123","state":"Gujarat","city":"Surat","agree":"1"}' | grep -q '"redirect":"/seller"'
          echo "seller registered"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000/seller); echo "/seller -> $code"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000/buyer); echo "/buyer as seller -> $code (redirect)"; [ "$code" = "307" ]
          curl -sf -c buyer.txt -X POST http://localhost:3000/api/auth/register -H 'Content-Type: application/json' -d '{"role":"buyer","name":"Meena Buyer","email":"buyer@example.com","phone":"9876501234","password":"BuyerPass123","agree":"1"}' | grep -q '"redirect":"/buyer"'
          echo "buyer registered"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b buyer.txt http://localhost:3000/buyer); echo "/buyer -> $code"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/seller); echo "/seller anonymous -> $code (redirect to login)"; [ "$code" = "307" ]
          curl -sf -b seller.txt http://localhost:3000/api/me/notifications | grep -q '"items"'
          check "/register?as=seller" 200
          # --- seller & buyer flows: product, requirement, inquiry, quote ---
          PID=$(curl -sf -b seller.txt -X POST http://localhost:3000/api/seller/products -H 'Content-Type: application/json' -d '{"name":"Organic Turmeric Powder","images":["/brand/coin.webp"],"priceMin":180,"priceMax":220,"priceUnit":"per kg","moq":"100 kg","summary":"High curcumin turmeric"}' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).item.id))")
          echo "product created $PID"
          curl -sf -b seller.txt http://localhost:3000/api/seller/products | grep -q 'Organic Turmeric'
          code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000/seller/products/$PID); echo "/seller/products/ID -> $code"; [ "$code" = "200" ]
          # admin approves the seller and the product (admin API, phase 6)
          curl -sf -b cookies.txt -X PUT http://localhost:3000/api/admin/sellers/$(curl -sf -b cookies.txt "http://localhost:3000/api/admin/sellers" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items[0].id))") -H 'Content-Type: application/json' -d '{"status":"approved","verified":true}' >/dev/null
          curl -sf -b cookies.txt -X PUT http://localhost:3000/api/admin/products/$PID -H 'Content-Type: application/json' -d '{"status":"approved"}' >/dev/null
          SLUG=$(curl -sf -b seller.txt http://localhost:3000/api/seller/products/$PID | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).item.slug))")
          check "/products/$SLUG" 200
          curl -s http://localhost:3000/products | grep -q 'Organic Turmeric' || { echo "::error title=Check failed::product in listing"; exit 1; }; echo "product listed"
          curl -s "http://localhost:3000/sellers/green-farms" | grep -q 'Green Farms' || { echo "::error title=Check failed::seller showroom"; exit 1; }; echo "showroom ok"
          # buyer posts a requirement, seller quotes, buyer accepts
          RID=$(curl -sf -b buyer.txt -X POST http://localhost:3000/api/buyer/requirements -H 'Content-Type: application/json' -d '{"title":"Need 500 kg organic turmeric monthly","quantity":"500","unit":"kg","deliveryState":"Maharashtra"}' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).item.id))")
          check "/requirements/$RID" 200
          curl -sf -b seller.txt -X POST http://localhost:3000/api/seller/leads/$RID/quote -H 'Content-Type: application/json' -d '{"price":195,"priceUnit":"per kg","deliveryTime":"7 days","message":"Fresh lot available"}' | grep -q '"held":true'
          # admin-first: the quote waits in the review queue until the admin forwards it
          QH=$(curl -sf -b buyer.txt http://localhost:3000/api/buyer/requirements | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items[0]._count.quotes))"); echo "quotes visible before review: $QH"; [ "$QH" = "0" ]
          RQ=$(curl -sf -b cookies.txt http://localhost:3000/api/admin/review | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).quotes[0].id))")
          curl -sf -b cookies.txt -X POST http://localhost:3000/api/admin/review -H 'Content-Type: application/json' -d "{\"kind\":\"quote\",\"id\":\"$RQ\",\"action\":\"forward\"}" | grep -q '"ok":true'
          echo "admin forwarded the quote"
          QID=$(curl -sf -b buyer.txt "http://localhost:3000/buyer/requirements/$RID" >/dev/null; curl -sf -b buyer.txt http://localhost:3000/api/buyer/requirements | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items[0]._count.quotes))"); echo "quotes on requirement: $QID"; [ "$QID" = "1" ]
          # guest inquiry on the product + buyer inquiry
          SID=$(curl -sf -b seller.txt http://localhost:3000/api/seller/profile | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).item.id))")
          curl -sf -X POST http://localhost:3000/api/inquiries -H 'Content-Type: application/json' -d "{\"sellerId\":\"$SID\",\"productId\":\"$PID\",\"name\":\"Guest Buyer\",\"email\":\"guest@example.com\",\"phone\":\"9000000000\",\"message\":\"Please send your best price for 200 kg\"}" | grep -q '"refNo"'
          curl -sf -b buyer.txt -X POST http://localhost:3000/api/inquiries -H 'Content-Type: application/json' -d "{\"sellerId\":\"$SID\",\"message\":\"Do you ship to Pune?\"}" | grep -q '"href":"/buyer/inquiries/'
          SEEN=$(curl -sf -b seller.txt http://localhost:3000/api/seller/inquiries | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items.length))"); echo "inquiries visible to seller before review: $SEEN"; [ "$SEEN" = "0" ]
          for RI in $(curl -sf -b cookies.txt http://localhost:3000/api/admin/review | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).inquiries.map(i=>i.id).join(' ')))"); do curl -sf -b cookies.txt -X POST http://localhost:3000/api/admin/review -H 'Content-Type: application/json' -d "{\"kind\":\"inquiry\",\"id\":\"$RI\",\"action\":\"forward\"}" | grep -q '"ok":true'; done
          echo "admin forwarded the inquiries"
          IID=$(curl -sf -b seller.txt http://localhost:3000/api/seller/inquiries | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items[0].id))")
          curl -sf -b seller.txt -X POST http://localhost:3000/api/seller/inquiries/$IID/messages -H 'Content-Type: application/json' -d '{"body":"Yes, we ship all India."}' | grep -q '"item"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000/seller/inquiries/$IID); echo "/seller/inquiries/ID -> $code"; [ "$code" = "200" ]
          for pth in /seller/products /seller/inquiries /seller/leads /seller/reviews /seller/profile /seller/membership /seller/analytics /seller/ai /seller/settings; do code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000$pth); echo "$pth -> $code"; [ "$code" = "200" ]; done
          for pth in /buyer/requirements /buyer/requirements/new "/buyer/requirements/$RID" /buyer/inquiries /buyer/quotes /buyer/favourites /buyer/reviews /buyer/profile /buyer/settings; do code=$(curl -s -o /dev/null -w "%{http_code}" -b buyer.txt "http://localhost:3000$pth"); echo "$pth -> $code"; [ "$code" = "200" ]; done
          # buyer review on the seller
          curl -sf -b buyer.txt -X POST http://localhost:3000/api/reviews -H 'Content-Type: application/json' -d "{\"sellerId\":\"$SID\",\"rating\":5,\"body\":\"Great quality turmeric, fast dispatch.\"}" | grep -q '"status"'
          # --- design system, calculator & SEO ---
          curl -s http://localhost:3000/ | grep -q 'aria-label="Post a requirement"' || { echo "::error title=Check failed::Post requirement button"; exit 1; }; echo "Post requirement button"
          curl -s http://localhost:3000/ | grep -q 'glass-ui' || { echo "::error title=Check failed::Glass design active"; exit 1; }; echo "Glass design active"
          curl -s http://localhost:3000/ | grep -q 'hdr-island{-webkit-backdrop-filter' || { echo "::error title=Check failed::Glass blur rules"; exit 1; }; echo "Glass blur rules present"
          curl -s http://localhost:3000/ | grep -q 'class="mnav' || { echo "::error title=Check failed::Mobile nav bar"; exit 1; }; echo "Mobile nav bar"
          curl -s http://localhost:3000/ | grep -q 'application/ld+json' || { echo "::error title=Check failed::Structured data"; exit 1; }; echo "Structured data"
          for pth in /admin/design /admin/offer /admin/pages /admin/languages; do code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt http://localhost:3000$pth); echo "$pth -> $code"; [ "$code" = "200" ]; done
          curl -sf -b cookies.txt http://localhost:3000/api/admin/settings/offer | grep -q 'title'
          curl -sf -b cookies.txt http://localhost:3000/api/admin/settings/design | grep -q 'glass'
          # save a section style and check the scoped CSS is rendered
          node -e "
            const j=(u,o={})=>fetch('http://localhost:3000'+u,{...o,headers:{'Content-Type':'application/json',cookie:require('fs').readFileSync('cookies.txt','utf8').split('\n').filter(l=>l.includes('rgv_session')).map(l=>'rgv_session='+l.split('\t').pop()).join('')}}).then(r=>r.json());
            (async()=>{const list=await j('/api/admin/pages?take=200');const home=list.items.find(p=>p.slug==='home');const full=await j('/api/admin/pages/'+home.id);const page=full.item||full;
            let blocks=typeof page.blocks==='string'?JSON.parse(page.blocks):page.blocks; blocks[1].data.style={bgType:'color',bgColor:'#123456',paddingTop:40};
            const r=await j('/api/admin/pages/'+home.id,{method:'PUT',body:JSON.stringify({...page,blocks})}); if(r.error){console.log(r);process.exit(1)}})()"
          curl -s http://localhost:3000/ | grep -q 'background:#123456' || { echo "::error title=Check failed::Section design CSS rendered"; exit 1; }; echo "Section design CSS rendered"
          # --- languages ---
          check /hi 200
          check /hi/about 200
          check /bn/blog 200
          check /ta/contact 200
          check /hi/products 200
          curl -s http://localhost:3000/ur -o /dev/null -w '%{http_code}' | grep -q '404' || { echo "::error title=Check failed::Urdu is removed (/ur is 404)"; exit 1; }; echo "Urdu removed"
          curl -s http://localhost:3000/hi | grep -qi 'hreflang' || { echo "::error title=Check failed::hreflang tags present"; exit 1; }; echo "hreflang tags present"
          curl -sf -b cookies.txt http://localhost:3000/api/admin/translations | grep -q '"locale":"hi"'
          # free Google engine (default) translates the other languages
          curl -sf -b cookies.txt -X PUT http://localhost:3000/api/admin/settings/translation -H 'Content-Type: application/json' -d '{"value":{"provider":"google","apiKey":"","model":"","autoTranslate":false,"enabled":["en","hi","bn","ta","te","mr","gu","kn","ml","pa","or","as"],"showSwitcher":true}}'
          echo
          RES=$(curl -s -b cookies.txt -X POST http://localhost:3000/api/admin/translations -H 'Content-Type: application/json' -d '{"action":"test","locale":"hi"}')
          echo "Translation test: $RES"
          echo "$RES" | grep -q '"result"'
          echo "All smoke tests passed"
      - name: Server log
        if: always()
        run: |
          tail -n 120 server.log || true
          if [ "${{ job.status }}" != "success" ] && [ -f server.log ]; then
            msg=$(grep -v '^\s*$' server.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Server log::$msg"
          fi

  # Same checks on PostgreSQL with files stored in the database (how it runs on Vercel)
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gvu
          POSTGRES_PASSWORD: gvu
          POSTGRES_DB: gvu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gvu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gvu:gvu@localhost:5432/gvu
      STORAGE: db
      ADMIN_SETUP: web
      DISABLE_AUTO_TRANSLATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build (like Vercel)
        run: |
          set -o pipefail
          npm run vercel-build 2>&1 | tee build.log || {
            msg=$(grep -v '^\s*$' build.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Postgres build failed::$msg"
            exit 1
          }
      - name: Start server
        run: |
          npx next start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/auth/me >/dev/null && break; sleep 2; done
      - name: Smoke test
        run: |
          set -e
          trap 'echo "::error title=Postgres smoke test failed::last command: $BASH_COMMAND"' ERR
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /about 200
          check /blog 200
          check /hi 200
          check /admin/login 200
          curl -s http://localhost:3000/admin/login | grep -q "Create admin account" && echo "First-run admin setup shown"
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/auth/setup -H 'Content-Type: application/json' -d '{"name":"Owner","email":"owner@example.com","password":"OwnerPass123"}'
          echo
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/auth/setup -H 'Content-Type: application/json' -d '{"name":"X","email":"x@example.com","password":"Another123"}'); echo "second setup -> $code"; [ "$code" = "403" ]
          curl -sf -b cookies.txt "http://localhost:3000/api/admin/pages?take=200" | grep -q '"slug":"about"'
          curl -sf -X POST http://localhost:3000/api/leads -H 'Content-Type: application/json' -d '{"name":"PG Test","phone":"+919876543210","service":"Selling on SHRIJAIV"}'
          curl -sf -b cookies.txt http://localhost:3000/api/admin/leads | grep -q "PG Test"
          # upload an image (stored in the database) and read it back
          printf '\x89PNG\r\n\x1a\n0000000000000' > test.png
          URL=$(curl -sf -b cookies.txt -F "files=@test.png;type=image/png" http://localhost:3000/api/admin/upload | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items[0].url))")
          echo "Uploaded: $URL"
          check "$URL" 200
          echo "All Postgres smoke tests passed"
      - name: Server log
        if: always()
        run: tail -n 120 server.log || true
