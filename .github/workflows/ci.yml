name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CiPassword123
      UPLOAD_DIR: uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            msg=$(grep -v '^\s*$' build.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          }
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/auth/me >/dev/null && break; sleep 2; done
      - name: Smoke test
        run: |
          set -e
          trap 'echo "::error title=Smoke test failed::see step output (last command: $BASH_COMMAND)"' ERR
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /about 200
          check /contact 200
          check /faq 200
          check /how-it-works 200
          check /become-a-seller 200
          check /become-a-buyer 200
          check /customer-support 200
          check /terms 200
          check /privacy 200
          check /products 200
          check /sellers 200
          check /requirements 200
          check /pricing 200
          check /category/organic-agriculture 200
          check /category/fruit 200
          check /post-requirement 200
          check /blog 200
          check /blog/organic-certification-india-npop-pgs-guide 200
          check /login 200
          check /register 200
          check /admin/login 200
          check /sitemap.xml 200
          check /robots.txt 200
          check /feed.xml 200
          check /does-not-exist 404
          curl -s http://localhost:3000/sitemap.xml | grep -q '/products' || { echo "::error title=Check failed::Marketplace pages in sitemap"; exit 1; }; echo "Marketplace pages in sitemap"
          curl -s http://localhost:3000/sitemap.xml | grep -q 'hreflang="hi"' || { echo "::error title=Check failed::hreflang in sitemap"; exit 1; }; echo "hreflang in sitemap"
          curl -sf -X POST http://localhost:3000/api/leads -H 'Content-Type: application/json' -d '{"name":"CI Test","phone":"+919876543210","service":"Selling on SHRIJAIV"}'
          echo
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"CiPassword123","admin":true}'
          echo
          curl -sf -b cookies.txt http://localhost:3000/api/admin/leads | grep -q "CI Test"
          curl -sf -b cookies.txt "http://localhost:3000/api/admin/pages?take=200" | grep -q '"slug":"about"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt http://localhost:3000/admin); echo "/admin -> $code"; [ "$code" = "200" ]
          # --- marketplace: seller & buyer accounts and dashboards ---
          curl -sf -c seller.txt -X POST http://localhost:3000/api/auth/register -H 'Content-Type: application/json' -d '{"role":"seller","name":"Ravi Seller","company":"Green Farms","email":"seller@example.com","phone":"9876543210","password":"SellerPass123","state":"Gujarat","city":"Surat"}' | grep -q '"redirect":"/seller"'
          echo "seller registered"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000/seller); echo "/seller -> $code"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" -b seller.txt http://localhost:3000/buyer); echo "/buyer as seller -> $code (redirect)"; [ "$code" = "307" ]
          curl -sf -c buyer.txt -X POST http://localhost:3000/api/auth/register -H 'Content-Type: application/json' -d '{"role":"buyer","name":"Meena Buyer","email":"buyer@example.com","phone":"9876501234","password":"BuyerPass123"}' | grep -q '"redirect":"/buyer"'
          echo "buyer registered"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b buyer.txt http://localhost:3000/buyer); echo "/buyer -> $code"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/seller); echo "/seller anonymous -> $code (redirect to login)"; [ "$code" = "307" ]
          curl -sf -b seller.txt http://localhost:3000/api/me/notifications | grep -q '"items"'
          check "/register?as=seller" 200
          # --- design system, calculator & SEO ---
          curl -s http://localhost:3000/ | grep -q 'aria-label="Post a requirement"' || { echo "::error title=Check failed::Post requirement button"; exit 1; }; echo "Post requirement button"
          curl -s http://localhost:3000/ | grep -q 'glass-ui' || { echo "::error title=Check failed::Glass design active"; exit 1; }; echo "Glass design active"
          curl -s http://localhost:3000/ | grep -q 'hdr-island{-webkit-backdrop-filter' || { echo "::error title=Check failed::Glass blur rules"; exit 1; }; echo "Glass blur rules present"
          curl -s http://localhost:3000/ | grep -q 'class="mnav' || { echo "::error title=Check failed::Mobile nav bar"; exit 1; }; echo "Mobile nav bar"
          curl -s http://localhost:3000/ | grep -q 'application/ld+json' || { echo "::error title=Check failed::Structured data"; exit 1; }; echo "Structured data"
          for pth in /admin/design /admin/offer /admin/pages /admin/languages; do code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt http://localhost:3000$pth); echo "$pth -> $code"; [ "$code" = "200" ]; done
          curl -sf -b cookies.txt http://localhost:3000/api/admin/settings/offer | grep -q 'title'
          curl -sf -b cookies.txt http://localhost:3000/api/admin/settings/design | grep -q 'glass'
          # save a section style and check the scoped CSS is rendered
          node -e "
            const j=(u,o={})=>fetch('http://localhost:3000'+u,{...o,headers:{'Content-Type':'application/json',cookie:require('fs').readFileSync('cookies.txt','utf8').split('\n').filter(l=>l.includes('rgv_session')).map(l=>'rgv_session='+l.split('\t').pop()).join('')}}).then(r=>r.json());
            (async()=>{const list=await j('/api/admin/pages?take=200');const home=list.items.find(p=>p.slug==='home');const full=await j('/api/admin/pages/'+home.id);const page=full.item||full;
            let blocks=typeof page.blocks==='string'?JSON.parse(page.blocks):page.blocks; blocks[1].data.style={bgType:'color',bgColor:'#123456',paddingTop:40};
            const r=await j('/api/admin/pages/'+home.id,{method:'PUT',body:JSON.stringify({...page,blocks})}); if(r.error){console.log(r);process.exit(1)}})()"
          curl -s http://localhost:3000/ | grep -q 'background:#123456' || { echo "::error title=Check failed::Section design CSS rendered"; exit 1; }; echo "Section design CSS rendered"
          # --- languages ---
          check /hi 200
          check /hi/about 200
          check /ur/blog 200
          check /ta/contact 200
          check /hi/products 200
          curl -s http://localhost:3000/ur | grep -q 'dir="rtl"' || { echo "::error title=Check failed::Urdu page is right-to-left"; exit 1; }; echo "Urdu page is right-to-left"
          curl -s http://localhost:3000/hi | grep -qi 'hreflang' || { echo "::error title=Check failed::hreflang tags present"; exit 1; }; echo "hreflang tags present"
          curl -sf -b cookies.txt http://localhost:3000/api/admin/translations | grep -q '"locale":"hi"'
          # free Google engine (default) translates the other languages
          curl -sf -b cookies.txt -X PUT http://localhost:3000/api/admin/settings/translation -H 'Content-Type: application/json' -d '{"value":{"provider":"google","apiKey":"","model":"","autoTranslate":false,"enabled":["en","hi","ur","bn","ta","te","mr","gu","kn","ml","pa","or","as"],"showSwitcher":true}}'
          echo
          RES=$(curl -s -b cookies.txt -X POST http://localhost:3000/api/admin/translations -H 'Content-Type: application/json' -d '{"action":"test","locale":"hi"}')
          echo "Translation test: $RES"
          echo "$RES" | grep -q '"result"'
          echo "All smoke tests passed"
      - name: Server log
        if: always()
        run: |
          tail -n 120 server.log || true
          if [ "${{ job.status }}" != "success" ] && [ -f server.log ]; then
            msg=$(grep -v '^\s*$' server.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Server log::$msg"
          fi

  # Same checks on PostgreSQL with files stored in the database (how it runs on Vercel)
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gvu
          POSTGRES_PASSWORD: gvu
          POSTGRES_DB: gvu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gvu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gvu:gvu@localhost:5432/gvu
      STORAGE: db
      ADMIN_SETUP: web
      DISABLE_AUTO_TRANSLATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build (like Vercel)
        run: |
          set -o pipefail
          npm run vercel-build 2>&1 | tee build.log || {
            msg=$(grep -v '^\s*$' build.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Postgres build failed::$msg"
            exit 1
          }
      - name: Start server
        run: |
          npx next start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/auth/me >/dev/null && break; sleep 2; done
      - name: Smoke test
        run: |
          set -e
          trap 'echo "::error title=Postgres smoke test failed::last command: $BASH_COMMAND"' ERR
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /about 200
          check /blog 200
          check /hi 200
          check /admin/login 200
          curl -s http://localhost:3000/admin/login | grep -q "Create admin account" && echo "First-run admin setup shown"
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/auth/setup -H 'Content-Type: application/json' -d '{"name":"Owner","email":"owner@example.com","password":"OwnerPass123"}'
          echo
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/auth/setup -H 'Content-Type: application/json' -d '{"name":"X","email":"x@example.com","password":"Another123"}'); echo "second setup -> $code"; [ "$code" = "403" ]
          curl -sf -b cookies.txt "http://localhost:3000/api/admin/pages?take=200" | grep -q '"slug":"about"'
          curl -sf -X POST http://localhost:3000/api/leads -H 'Content-Type: application/json' -d '{"name":"PG Test","phone":"+919876543210","service":"Selling on SHRIJAIV"}'
          curl -sf -b cookies.txt http://localhost:3000/api/admin/leads | grep -q "PG Test"
          # upload an image (stored in the database) and read it back
          printf '\x89PNG\r\n\x1a\n0000000000000' > test.png
          URL=$(curl -sf -b cookies.txt -F "files=@test.png;type=image/png" http://localhost:3000/api/admin/upload | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).items[0].url))")
          echo "Uploaded: $URL"
          check "$URL" 200
          echo "All Postgres smoke tests passed"
      - name: Server log
        if: always()
        run: tail -n 120 server.log || true
